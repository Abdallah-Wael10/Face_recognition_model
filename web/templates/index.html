<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikvision Face Recognition System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .video-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .video-feed {
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .stats-card, .detections-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .card-header h3 {
            color: #2c3e50;
            margin-left: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #3498db;
        }
        
        .detection-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .detection-item {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        
        .detection-name {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .detection-time {
            font-size: 0.8em;
            color: #7f8c8d;
        }
        
        .unknown {
            border-left-color: #e74c3c;
        }
        
        .navigation {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .nav-btn {
            flex: 1;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        .nav-btn:hover {
            background: #2980b9;
        }
        
        .live-badge {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #e74c3c;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Hikvision Face Recognition System</h1>
            <p>Real-time face detection and recognition with live streaming</p>
        </div>
        
        <div class="main-content">
            <div class="video-container">
                <div class="card-header">
                    <span class="live-badge"></span>
                    <h3>Live Camera Feed</h3>
                </div>
                <div class="video-feed">
                    <img src="{{ url_for('video_feed') }}" alt="Live Camera Feed">
                </div>
            </div>
            
            <div class="sidebar">
                <div class="stats-card">
                    <div class="card-header">
                        <h3>📊 Statistics</h3>
                    </div>
                    <div id="stats-container">
                        <div class="stat-item">
                            <span>Today's Detections:</span>
                            <span class="stat-value" id="today-count">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Unique Persons Today:</span>
                            <span class="stat-value" id="unique-today">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Total Detections:</span>
                            <span class="stat-value" id="total-count">0</span>
                        </div>
                    </div>
                </div>
                
                <div class="detections-card">
                    <div class="card-header">
                        <h3>👥 Recent Detections</h3>
                    </div>
                    <div class="detection-list" id="detection-list">
                        <!-- Detections will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navigation">
            <button class="nav-btn" onclick="location.href='/dashboard'">
                📈 Detailed Dashboard
            </button>
        </div>
    </div>

    <script>
        function updateStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('today-count').textContent = data.today_detections;
                    document.getElementById('unique-today').textContent = data.unique_today;
                    document.getElementById('total-count').textContent = data.total_detections;
                })
                .catch(error => console.error('Error fetching stats:', error));
        }
        
        function updateDetections() {
            fetch('/api/detections')
                .then(response => response.json())
                .then(data => {
                    const detectionList = document.getElementById('detection-list');
                    detectionList.innerHTML = '';
                    
                    data.recent_detections.forEach(detection => {
                        const detectionItem = document.createElement('div');
                        detectionItem.className = `detection-item ${detection.name === 'Unknown' ? 'unknown' : ''}`;
                        
                        detectionItem.innerHTML = `
                            <div class="detection-name">${detection.name}</div>
                            <div class="detection-time">${new Date(detection.time).toLocaleString()}</div>
                        `;
                        
                        detectionList.appendChild(detectionItem);
                    });
                })
                .catch(error => console.error('Error fetching detections:', error));
        }
        
        // Update stats every 5 seconds
        setInterval(updateStats, 5000);
        setInterval(updateDetections, 3000);
        
        // Initial load
        updateStats();
        updateDetections();
    </script>
</body>
</html>
